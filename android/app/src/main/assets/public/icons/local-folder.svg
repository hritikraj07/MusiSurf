<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Dark Replay / Obsidian Tile Background (#18191e to #0a0b0d) -->
    <linearGradient id="folderTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Platinum Solid Fill Gradient (Exact Match to Replay Emblem) -->
    <linearGradient id="folderPlatinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </linearGradient>

    <!-- Platinum Shadow / Midtone Gradient -->
    <linearGradient id="folderMidtoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd2db"/>
      <stop offset="100%" stop-color="#b4b8c4"/>
    </linearGradient>

    <!-- Folder Interior Document Paper Gradient -->
    <linearGradient id="folderInteriorPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ebf0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="replayFolderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Full Tile Background (Edge-to-edge with no inner stroke border) -->
  <rect width="128" height="128" fill="url(#folderTileBg)"/>

  <!-- Centered Folder Emblem in Replay Platinum/Chrome Palette -->
  <g filter="url(#replayFolderGlow)">
    <!-- Back Folder Tab & Shell in Chrome Midtone -->
    <path d="M25 36 C25 31, 29 27, 34 27 L53 27 C57 27, 60 29.5, 62 33 L67 40 L94 40 C99 40, 103 44, 103 49 L103 91 C103 96, 99 100, 94 100 L34 100 C29 100, 25 96, 25 91 Z" 
          fill="url(#folderMidtoneGrad)" stroke="#121316" stroke-width="4" stroke-linejoin="round"/>

    <!-- Interior Platinum Document Sheets -->
    <rect x="33" y="35" width="62" height="46" rx="5" fill="url(#folderInteriorPaper)" stroke="#121316" stroke-width="3"/>
    <line x1="42" y1="46" x2="68" y2="46" stroke="#8a8f9c" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="54" x2="82" y2="54" stroke="#8a8f9c" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="62" x2="74" y2="62" stroke="#8a8f9c" stroke-width="3" stroke-linecap="round"/>

    <!-- Inset Accent Shadow -->
    <path d="M22 55 L106 55 L102 96 C102 98, 100 100, 97 100 L31 100 C28 100, 26 98, 26 96 Z" fill="#121316" opacity="0.35"/>

    <!-- Primary Folder Body Front Flap in Radiant Platinum Gradient -->
    <path d="M21 52 C21 47.5, 24.5 44, 29 44 L99 44 C103.5 44, 107 47.5, 107 52 L103 93 C102.5 97.5, 99 101, 94.5 101 L33.5 101 C29 101, 25.5 97.5, 25 93 Z" 
          fill="url(#folderPlatinumGrad)" stroke="#121316" stroke-width="4" stroke-linejoin="round"/>

    <!-- Folder Body Front Highlight Edge -->
    <path d="M30 49 L98 49" stroke="rgba(255, 255, 255, 0.9)" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
