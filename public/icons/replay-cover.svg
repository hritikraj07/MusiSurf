<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark Slate/Charcoal Gradient Background -->
    <linearGradient id="replayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Platinum Solid Fill Gradient -->
    <linearGradient id="solidArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="replayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="400" height="400" rx="44" fill="url(#replayBg)"/>
  <rect width="398" height="398" x="1" y="1" rx="43" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Centered Replay Emblem -->
  <g filter="url(#replayGlow)">
    <!-- 1. Solid 270° Arc (from 12 o'clock clockwise to 9 o'clock) -->
    <path d="M 200 60 A 140 140 0 1 1 60 200 L 128 200 A 72 72 0 1 0 200 128 Z" fill="url(#solidArcGrad)"/>

    <!-- 2. Dashed 90° Quadrant (from 9 o'clock to 12 o'clock, 4 dashed blocks along radius 106) -->
    <path d="M 94 200 A 106 106 0 0 1 200 94"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.9"
          stroke-width="68"
          stroke-dasharray="29 14.5"
          stroke-dashoffset="0"
          stroke-linecap="butt"/>

    <!-- Center Play Button Triangle -->
    <polygon points="186,168 230,200 186,232" fill="#ffffff" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
