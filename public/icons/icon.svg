<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- Modern Platinum & Pure White Gradient -->
    <linearGradient id="musiLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f2f5"/>
      <stop offset="100%" stop-color="#cfd4dc"/>
    </linearGradient>

    <!-- Deep Obsidian Charcoal Backdrop -->
    <radialGradient id="musiLogoBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="70%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>

    <filter id="musiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Background for Adaptive Maskable Icon -->
  <rect width="100" height="100" fill="url(#musiLogoBg)"/>

  <!-- Logo Icon: Headphone + Pill Microphone Scaled to Safe Zone (66% scale, centered) -->
  <g transform="translate(50, 50) scale(0.66) translate(-50, -52)" filter="url(#musiGlow)">
    <!-- Headphone Band -->
    <path d="M 19 55 A 31 31 0 0 1 81 55" fill="none" stroke="url(#musiLogoGrad)" stroke-width="6.5" stroke-linecap="round"/>

    <!-- Left Earcup -->
    <rect x="11" y="45" width="10" height="22" rx="5" fill="url(#musiLogoGrad)"/>
    <rect x="18" y="49" width="5" height="14" rx="2" fill="url(#musiLogoGrad)"/>

    <!-- Right Earcup -->
    <rect x="79" y="45" width="10" height="22" rx="5" fill="url(#musiLogoGrad)"/>
    <rect x="77" y="49" width="5" height="14" rx="2" fill="url(#musiLogoGrad)"/>

    <!-- Pill-Shaped Condenser Microphone -->
    <!-- Microphone Body -->
    <rect x="38" y="38" width="24" height="42" rx="12" fill="url(#musiLogoGrad)"/>

    <!-- 4 Horizontal Grille Slots -->
    <rect x="38" y="46" width="13" height="2.5" rx="1.25" fill="#000000"/>
    <rect x="38" y="51.5" width="13" height="2.5" rx="1.25" fill="#000000"/>
    <rect x="38" y="57" width="13" height="2.5" rx="1.25" fill="#000000"/>
    <rect x="38" y="62.5" width="13" height="2.5" rx="1.25" fill="#000000"/>

    <!-- Bottom Circular Knob and Stem Cutout -->
    <circle cx="50" cy="72.5" r="3.2" fill="#000000"/>
    <rect x="48.8" y="72.5" width="2.4" height="7.5" fill="#000000"/>
  </g>
</svg>
