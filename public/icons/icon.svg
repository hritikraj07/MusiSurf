<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b"/>
      <stop offset="100%" stop-color="#14161d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Glowing Soundwaves and Surf Crest -->
  <g filter="url(#glow)">
    <!-- Central Sound Waves -->
    <rect x="96" y="210" width="28" height="92" rx="14" fill="url(#wave)"/>
    <rect x="144" y="160" width="28" height="192" rx="14" fill="url(#wave)"/>
    <rect x="192" y="110" width="28" height="292" rx="14" fill="url(#wave)"/>
    <rect x="240" y="80" width="32" height="352" rx="16" fill="url(#wave)"/>
    <rect x="292" y="130" width="28" height="252" rx="14" fill="url(#wave)"/>
    <rect x="340" y="180" width="28" height="152" rx="14" fill="url(#wave)"/>
    <rect x="388" y="224" width="28" height="64" rx="14" fill="url(#wave)"/>
    
    <!-- Surf Wave Arch -->
    <path d="M 80 390 C 200 450, 320 330, 432 390" fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
